<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>SNIPER ARENA</title><link rel="stylesheet" href="style.css"></head>
<body><div id="game"></div>
<div id="menu"><div class="logo">SNIPER <span>ARENA</span></div><p>ONLINE TACTICAL ARENA</p><input id="nickname" maxlength="14" placeholder="닉네임" value="Sniper"><button id="play">전투 참가</button><small>전투 입장 전 6학년 퀴즈를 풀어야 합니다.<br>PC: WASD 이동 · Shift 슬라이드 · 우클릭 조준 · 좌클릭 발사 · F 주먹</small></div>
<div id="quiz" class="hidden"><div class="quiz-card"><div class="quiz-tag">EDU CHALLENGE · GRADE 6</div><h2>전투 입장 시험</h2><p>문제를 맞히면 스나이퍼 아레나에 입장할 수 있어요.</p><div id="quiz-subject">수학</div><h3 id="quiz-question">문제</h3><div id="quiz-options"></div><div id="quiz-feedback" aria-live="polite"></div><button id="quiz-back" class="quiz-back">로비로 돌아가기</button></div></div>
<div id="hud" class="hidden"><div class="top"><div class="pill" id="online">ONLINE 1</div><div class="pill">SNIPER ARENA</div><div class="pill" id="score">K 0 / D 0</div></div><div id="crosshair"><i></i><b></b></div><div id="scope"><div class="scope-ring"></div></div><div id="hitmark">✦</div><div id="feed"></div><div id="bottom"><div id="hp"><span>HP</span><b><i id="hpbar"></i></b><strong id="hpnum">100</strong></div><div id="ammo">5 <small>/ 5</small></div><div id="hint">좌클릭 발사 · R 재장전 · F 주먹</div></div><div id="reload" class="hidden">RELOADING</div>
<div id="mobile"><div id="stick"><div id="nub"></div></div><button id="fire">FIRE</button><button id="aim">조준</button><button id="punch">주먹</button><button id="jump">점프</button><button id="slide">슬라이드</button></div></div>
<script src="/socket.io/socket.io.js"></script><script type="module" src="game.js"></script></body></html>
